<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>

<body>
    <form name="registration" action="#" method="get">
        <fieldset>
            <legend>Personal data</legend>
            <p>
                <label for="fName">First Name</label>
                <input id="fName" type="text" name="firstName" placeholder="Peter">
            </p>
            <p>
                <label>Last Name
                    <input type="text" name="lastName" placeholder="Parker">
                </label>
            <p>
            <p>
                <label>Email:
                    <input type="text" name="email" placeholder="eMail" required autofocus>
                </label>
            </p>
            <p>
                <label>Password
                    <input type="password" name="password" >
                </label>
            </p>
            <p>
                <label>
                    <input type="radio" name="gender" value="male">
                    Male
                </label>
                <label>
                    <input type="radio" name="gender" value="female">
                    Female
                </label>
                <label>
                    <input type="radio" name="gender" value="other">
                    Other
                </label>
            </p>
            <p>
                Hobbies:
                <label>
                    <input type="checkbox" name="vodka">
                    Vodka
                </label>
                                <label>
                    <input type="checkbox" name="cannabis">
                    Cannabis
                </label>
                                <label>
                    <input type="checkbox" name="sex">
                    Sex
                </label>
            </p>
            <p>
                <label>Birthday:
                    <input type="date" name="birthdate">
                </label>
            </p>
            <p>
                <label>Comment:
                    <textarea name="comment" cols="30" rows="10"></textarea>
                </label>
            </p>
<p>
    <label>Languages:
        <select name="lang">
            <option value="en">English</option>
            <option value="ru">Russian</option>
        </select>
    </label>
</p>
        </fieldset>
        <button type="submit">Send</button>
        <button type="reset">Clear</button>
        <button type="button">Back</button>
        <button type="button">Forward</button>
    </form>
</body>

</html>
